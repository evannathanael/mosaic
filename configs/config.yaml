# Mosaic — central config
# Change settings here rather than in code, so every run is reproducible.

seed: 123

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  near_duplicates_dir: "data/near_duplicates"
  # Held out entirely from training — used only for the unseen-generator test
  holdout_generator: "wildfake_gan"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  image_size: 224

# The 6 required robustness transforms (fixed by the challenge spec — do not
# change parameter values here without checking the problem statement).
transforms:
  jpeg_compression:
    qualities: [90, 70, 50, 30]
  gaussian_blur:
    sigmas: [0.5, 1.0, 2.0]
  resize:
    scales: [0.5, 0.25]
  gaussian_noise:
    sigmas: [0.02, 0.05, 0.10]
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
  center_crop:
    crop_fraction: 0.8

# Training-only extra augmentation (NOT part of official eval — helps prevent
# the model from learning color/shortcut cues instead of real AI artifacts,
# per the workshop's SAFE (KDD 2025) recommendation).
train_only_augmentation:
  random_rotation_degrees: 15
  extra_color_jitter: true

model:
  backbone: "ViT-L-14" # open_clip model name — matches Chelsea's similarity backbone
  pretrained: "openai" # pretrained weight tag
  freeze_backbone: true # set false to fine-tune the backbone too
  embedding_dim: 768 # must match the chosen backbone's output dim
  classifier_hidden_dim: 256
  dropout: 0.2

training:
  batch_size: 64
  epochs: 15
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  early_stopping_patience: 3
  device: "cuda" # falls back to cpu automatically if unavailable

# Named training-run variants for Person B's parallel experiments.
# Run with: python src/models/train.py --config configs/config.yaml --experiment <name>
experiments:
  baseline:
    train_only_augmentation:
      random_rotation_degrees: 0
      extra_color_jitter: false
  rotation_jitter:
    train_only_augmentation:
      random_rotation_degrees: 15
      extra_color_jitter: true
  finetune_backbone:
    model:
      freeze_backbone: false

similarity:
  # Live CLIP upload embeddings are opt-in. Keep false on memory-constrained
  # machines; exact SHA-256 clustering remains available as a safe fallback.
  enabled: false
  threshold: 0.90
  clustering_method: "threshold"
  dbscan_eps: 0.15
  dbscan_min_samples: 2

evaluation:
  primary_metric: "auc"
  # Caps each data source (cifake/sid_set/wildfake) to at most this many
  # samples (stratified by label) before combining them in
  # scan_all_sources() — WildFake's manifest alone can have 200K+ rows,
  # which is heavy to decode from ZIP archives on a memory-constrained Colab
  # instance. Set to null to disable capping.
  max_samples_per_source: 3000
  # Eval-only batch size, separate from training.batch_size (Glory's config
  # for train.py/train_clip_head.py) — kept small deliberately since eval
  # runs on Colab's free-tier RAM, which has been OOM-killing DataLoader
  # workers at the larger training batch size.
  batch_size: 16
  robustness_conditions:
    - clean
    - jpeg_q30
    - blur_sigma2
    - crop_80
    - unseen_generator
  final_score_weights:
    auc_clean: 0.5
    auc_robust: 0.5

# Trained AI-vs-real detector used by the backend feed (backend/detector.py):
# a frozen CLIP backbone + the MLP head saved in `checkpoint`. `threshold` is the
# P(AI) at/above which a post is labelled AI-generated.
detector:
  # Live ViT-L/14 inference is opt-in because it can exceed a laptop's virtual
  # memory (Windows error 1455). Enable after configuring sufficient RAM/pagefile.
  enabled: false
  checkpoint: "combined_head.pt"
  threshold: 0.5
  # Re-score the committed demo seed posts with the model at startup. Turn off to
  # keep the curated fixture labels (useful when the checkpoint generalises poorly
  # to the demo image set) while still scoring live uploads.
  score_seed: true

calibration:
  method: "temperature_scaling"

output:
  dir: "outputs"
  checkpoint_name: "model_best.pt"
